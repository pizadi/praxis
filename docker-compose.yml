services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    networks:
      - clinic-net
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: ${APP_TIMEZONE}
    volumes:
      # On the Pi: point these at an SSD-backed mount instead of the SD card.
      - pgdata:/var/lib/postgresql/data
    ports:
      # Host-mapped port for Alembic / migration scripts run from host.
      # Loopback-only: LAN machines have no business talking to Postgres.
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5434}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    command:
      # Tuned for Raspberry Pi (small RAM)
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - max_connections=20

  api:
    build: ./backend
    restart: unless-stopped
    networks:
      - clinic-net
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      SECRET_KEY: ${SECRET_KEY}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS}
      CORS_ORIGINS: ${CORS_ORIGINS}
      UPLOAD_DIR: ${UPLOAD_DIR}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES}
      APP_TIMEZONE: ${APP_TIMEZONE}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD}
      CLINIC_ENV: production
      LOGIN_MAX_FAILURES: ${LOGIN_MAX_FAILURES}
      LOGIN_LOCK_MINUTES: ${LOGIN_LOCK_MINUTES}
      TZ: ${APP_TIMEZONE}
    volumes:
      # On the Pi: use an SSD-backed bind mount or named volume for files.
      - uploads:/data/uploads
    ports:
      # Direct access for dev; in production nginx proxies /api → api:8000
      - "127.0.0.1:8000:8000"

  web:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api/v1
    restart: unless-stopped
    networks:
      - clinic-net
    depends_on:
      - api
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro

networks:
  clinic-net:
    name: clinic-net
    driver: bridge

volumes:
  pgdata:
  uploads:
