name: e2e

on: [push, pull_request]

jobs:
  playwright:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - run: npm ci
      # CI CAN download browsers (the sandbox cannot); the config reads
      # E2E_CHROMIUM_PATH — set to the playwright-installed chromium
      - run: npx playwright install chromium
      - run: |
          CHROMIUM_PATH=$(find ~/.cache/ms-playwright -name chrome -path '*chrome-linux*' | head -1)
          echo "E2E_CHROMIUM_PATH=$CHROMIUM_PATH" >> $GITHUB_ENV
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: frontend/test-results/
          retention-days: 7
