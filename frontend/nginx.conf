# Single source for the web container's nginx config: baked into the image
# (frontend/Dockerfile) and bind-mounted by compose — edit here only.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # basic hardening (LAN: no TLS/HSTS; keep CSP conservative so the
    # blob-based image/PDF previews keep working)
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'" always;

    # SPA fallback (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Backup import: tarballs are admin-initiated and can be FAR larger than
    # patient attachments — no body cap here (attachments keep theirs below),
    # and no request buffering: the body streams through to the api so the
    # browser's upload progress is honest and the body never lands on
    # nginx's disk.
    location = /api/v1/admin/backup/import {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 0;
        proxy_request_buffering off;
    }

    # API reverse proxy
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 50m;
    }
}
